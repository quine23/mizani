{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth">
  <h1 class="wordmark">Mizani</h1>
  <p class="lede">Track what comes in, what goes out, and what is left.</p>
  <form method="post" novalidate>
    {{ csrf_input() }}
    {% if error %}<p class="field-error" role="alert">{{ error }}</p>{% endif %}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ form.get('email', '') }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="aside">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
